# Configuración del Agente Rastreador de Empleos en Costa Rica
# Ajustado para Luis Diego Agüero Quirós:
# - Idiomas: EXCLUSIVAMENTE Español o Inglés.
# - Puestos cubiertos:
#   1. Soporte TI, Technical Support, Redes y Tickets (Junior, Mid y Senior)
#   2. Análisis de Datos (Junior / Entry Level)
#   3. Digitador, Data Entry, Data Management & Back Office Administrativo
# - Sondeo directo a empresas multinacionales en Costa Rica (Equifax, DHL, Amazon, Intel, etc.)

agent:
  scan_interval_minutes: 30
  max_alerts_per_cycle: 12
  country: "Costa Rica"

# Idiomas descartados (solo español e inglés son válidos)
